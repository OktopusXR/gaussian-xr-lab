name: Deploy WebXR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Fetch optional forest 360 asset from Google Drive
        continue-on-error: true
        run: |
          python -m pip install --quiet gdown
          mkdir -p assets/videos360
          gdown 13MChbPfCHqbhYhf8NAulP9y8eiUX0r6c -O /tmp/bosque_source.mp4
          if [ -s /tmp/bosque_source.mp4 ]; then
            ffmpeg -hide_banner -loglevel error -y -i /tmp/bosque_source.mp4 -vf scale=2880:1440 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an assets/videos360/bosque_webxr.mp4
          fi
      - name: Register forest asset if downloaded
        run: |
          node -e "const fs=require('fs');const p='assets/videos360/bosque_webxr.mp4';if(fs.existsSync(p)&&fs.statSync(p).size>100000){const m=JSON.parse(fs.readFileSync('assets/manifest.json'));m.videos360=[{id:'bosque',label:'Bosque 360',path:'assets/videos360/bosque_webxr.mp4'}];fs.writeFileSync('assets/manifest.json',JSON.stringify(m,null,2));}else{console.log('Drive download unavailable; skipping forest asset.');}"
      - name: Download reconstructed forest splats from successful workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/splats
          python - <<'PY'
          import json, os, urllib.request, zipfile, io
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  newreq=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if newreq and 'api.github.com' not in newurl:
                      newreq.remove_header('Authorization')
                  return newreq
          opener=urllib.request.build_opener(SafeRedirect)
          repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'gaussian-xr-lab'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/reconstruct-forest.yml/runs?status=success&per_page=10',headers=headers)
          runs=json.load(opener.open(req)).get('workflow_runs',[])
          found=False
          for run in runs:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts',headers=headers)
              arts=json.load(urllib.request.urlopen(req)).get('artifacts',[])
              for a in arts:
                  if a['name']=='bosque-depth-3dgs' and not a.get('expired'):
                      req=urllib.request.Request(a['archive_download_url'],headers=headers)
                      payload=urllib.request.urlopen(req).read()
                      with zipfile.ZipFile(io.BytesIO(payload)) as z:
                          name=next(n for n in z.namelist() if n.endswith('.ply'))
                          data=z.read(name)
                          if len(data)<1000:raise ValueError('Invalid PLY artifact')
                          open('assets/splats/bosque_depth_3dgs.ply','wb').write(data)
                      found=True
                      break
              if found:break
          if not found:print('No successful forest splat artifact found; continuing without splat.')
          else:print('Forest splat asset downloaded successfully')
          PY
      - name: Register available forest assets
        run: |
          node -e "const fs=require('fs');const p='assets/splats/bosque_depth_3dgs.ply';const m=JSON.parse(fs.readFileSync('assets/manifest.json'));if(fs.existsSync(p)&&fs.statSync(p).size>1000){m.splats=[{id:'bosque-depth',label:'Bosque 3D · Gaussian Splatting',path:p}];}fs.writeFileSync('assets/manifest.json',JSON.stringify(m,null,2));"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
